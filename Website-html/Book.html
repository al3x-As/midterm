<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LockBox | Book Your Room</title>
  <link rel="stylesheet" href="../Website - css/navbar.css">
  <link rel="stylesheet" href="../Website - css/book.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

  <!-- NAVBAR CONTAINER -->
  <div id="navbar"></div>

  <!-- BOOKING SECTION -->
  <section class="booking-section">
    <h1>Book Your Adventure</h1>
    <p class="subtitle">Select your room, choose a date & time, and prepare to escape!</p>

    <form id="bookingForm" class="booking-form">
      
      <!-- STEP 1: CHOOSE A ROOM -->
      <div class="form-group">
        <label for="roomSelect"><i class="bi bi-door-open"></i> Select Room</label>
        <select id="roomSelect" required>
          <option value="" disabled selected>Choose an escape room...</option>
          <option value="The Haunted Laboratory">The Haunted Laboratory (Difficulty: 4/5)</option>
          <option value="Ancient Tomb Mystery">Ancient Tomb Mystery (Difficulty: 3/5)</option>
          <option value="Bank Heist Mission">Bank Heist Mission (Difficulty: 5/5)</option>
        </select>
      </div>

      <!-- STEP 2: DATE & TIME -->
      <div class="form-row">
        <div class="form-group">
          <label for="bookingDate"><i class="bi bi-calendar-event"></i> Date</label>
          <input type="date" id="bookingDate" required>
        </div>

        <div class="form-group">
          <label for="timeSlot"><i class="bi bi-clock"></i> Time Slot</label>
          <select id="timeSlot" required>
            <option value="" disabled selected>Select time...</option>
            <option value="12:00 PM">12:00 PM</option>
            <option value="02:00 PM">02:00 PM</option>
            <option value="04:00 PM">04:00 PM</option>
            <option value="06:00 PM">06:00 PM</option>
            <option value="08:00 PM">08:00 PM</option>
            <option value="10:00 PM">10:00 PM</option>
          </select>
        </div>
      </div>

      <!-- STEP 3: PLAYERS -->
      <div class="form-row">
        <div class="form-group">
          <label for="playerCount"><i class="bi bi-people"></i> Players</label>
          <select id="playerCount" required>
            <option value="2">2 Players (€20/person)</option>
            <option value="3">3 Players (€18/person)</option>
            <option value="4" selected>4 Players (€16/person)</option>
            <option value="5">5 Players (€15/person)</option>
            <option value="6">6 Players (€14/person)</option>
          </select>
        </div>

        <div class="form-group price-display">
          <label>Total Price</label>
          <div class="total-price" id="totalPrice">€64</div>
        </div>
      </div>

      <hr class="form-divider">

      <!-- STEP 4: CONTACT INFO -->
      <div class="form-group">
        <label for="fullName"><i class="bi bi-person"></i> Full Name</label>
        <input type="text" id="fullName" placeholder="e.g. Alex Smith" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email"><i class="bi bi-envelope"></i> Email Address</label>
          <input type="email" id="email" placeholder="alex@example.com" required>
        </div>

        <div class="form-group">
          <label for="phone"><i class="bi bi-telephone"></i> Phone Number</label>
          <input type="tel" id="phone" placeholder="+30 6912 345 678" required>
        </div>
      </div>

      <button type="submit" class="book-submit-btn">Confirm Reservation</button>
    </form>

    <!-- SUCCESS MESSAGE POPUP -->
    <div id="successModal" class="modal">
      <div class="modal-content">
        <i class="bi bi-check-circle-fill success-icon"></i>
        <h2>Booking Confirmed!</h2>
        <p id="modalDetails">Thank you! Your reservation details have been sent to your email.</p>
        <button onclick="closeModal()" class="close-modal-btn">Done</button>
      </div>
    </div>
  </section>

  <!-- NAVBAR SCRIPT -->
  <script src="../Website - js/navbar.js"></script>
  <!-- BOOKING SCRIPT -->
  <script src="../Website - js/book.js"></script>
</body>
</html>
